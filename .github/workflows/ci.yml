name: AWS Analytics Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  etl-and-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cfn-lint

      - name: Generate raw extract
        run: python data/generate_sales_data.py

      - name: Run PyArrow ETL
        run: python python/etl_pipeline.py

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Syntax-check AWS helper scripts
        run: python -m compileall -q python data

      - name: Validate CloudFormation template
        run: cfn-lint infra/cloudformation.yaml
