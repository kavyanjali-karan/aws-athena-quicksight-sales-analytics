name: Deploy Sales Dashboard

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "python/**"
      - "athena/**"
      - "assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt matplotlib

      - name: Generate raw extract
        run: python data/generate_sales_data.py

      - name: Run PyArrow ETL
        run: python python/etl_pipeline.py

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Render dashboard previews
        run: python python/render_previews.py

      - name: Build interactive dashboard
        run: python python/generate_interactive_dashboard.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: assets

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
